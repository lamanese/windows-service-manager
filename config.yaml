# Windows Service Manager -- Configuration
# All fields are optional. Missing values are replaced by defaults.
# Place this file in the project root (next to start.bat).

# ---------------------------------------------------------------------------
# Server settings
# ---------------------------------------------------------------------------
server:
  # Bind address of the backend.
  # "0.0.0.0" = all network interfaces (default).
  # "127.0.0.1" = local connections only (recommended behind reverse proxy).
  host: "0.0.0.0"

  # TCP port the FastAPI server listens on.
  port: 8080

  # Display name shown in the web UI header.
  # Empty or not set = server hostname is used.
  # name: "My Production Server"
  name: ""

# ---------------------------------------------------------------------------
# Logging / Audit Log
# ---------------------------------------------------------------------------
logging:
  # Path to the audit log file.
  # Relative to the project root or absolute path.
  audit_log: "logs/audit.log"

  # Maximum file size in megabytes before the file is rotated.
  max_size_mb: 10

  # Number of backup files to keep after rotation
  # (e.g. audit.log.1, audit.log.2, ...).
  backup_count: 5

# ---------------------------------------------------------------------------
# UI Defaults
# ---------------------------------------------------------------------------
# Defines which columns and filters are active by default when loading
# the web interface.
#
ui_defaults:
  # Show the "Startup Type" column by default (true/false).
  show_startup_type: true

  # Show the "Log On As" column by default (true/false).
  show_logon_as: false

  # Default status filter: "all", "running", or "stopped".
  filter_status: "all"

  # Default startup type filter: "all", "Automatic", "Manual", or "Disabled".
  filter_startup_type: "Automatic"

# ---------------------------------------------------------------------------
# Service Filters
# ---------------------------------------------------------------------------
# Defines which Windows services are displayed in the web interface.
#
# If the list is empty (or this section is missing), ALL Win32 services
# are displayed.
#
# Multiple filters are combined with OR logic: a service is displayed
# if it matches at least one filter.
#
# Filter types:
#   prefix   -- Service name starts with the given value (case-insensitive)
#   contains -- Service name contains the given value (case-insensitive)
#
service_filters:
  # Show all services whose name starts with "MyApp".
  # Matches e.g.: MyAppWorker, MyAppScheduler, myappapi
  - type: "prefix"
    value: "Lim"

  # Show all services whose name contains "Worker".
  # Matches e.g.: BackgroundWorker, DataWorker, MyAppWorker
  - type: "contains"
    value: ""

# ---------------------------------------------------------------------------
# Service Exclude List
# ---------------------------------------------------------------------------
# Services in this list are never displayed, even if a filter from
# service_filters matches them.
# Use the internal SCM service names (not the display name).
#
service_exclude:
  - ""
  - ""

# ---------------------------------------------------------------------------
# Rate Limiting
# ---------------------------------------------------------------------------
# Applies only to action endpoints (start, stop, restart).
# GET /api/services is not affected.
#
rate_limit:
  # Maximum number of actions per IP address within the time window.
  max_requests: 10

  # Length of the sliding time window in seconds.
  window_seconds: 60

# ---------------------------------------------------------------------------
# Service Control
# ---------------------------------------------------------------------------
# Settings for state transitions when starting/stopping a service.
#
service_control:
  # Maximum wait time in seconds for a service to reach its target state.
  # If exceeded, the backend responds with HTTP 504.
  timeout_seconds: 30

  # Interval in milliseconds between status polls during
  # a state transition (polling interval).
  poll_interval_ms: 500
