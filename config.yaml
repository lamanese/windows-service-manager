# Windows Service Manager -- Konfiguration
# Alle Felder sind optional. Fehlende Werte werden durch die Standardwerte ersetzt.
# Legen Sie diese Datei im Stammverzeichnis des Projekts ab (neben start.bat).

# ---------------------------------------------------------------------------
# Server-Einstellungen
# ---------------------------------------------------------------------------
server:
  # Bind-Adresse des Backends.
  # "0.0.0.0" = alle Netzwerkschnittstellen (Standard).
  # "127.0.0.1" = nur lokale Verbindungen (empfohlen hinter Reverse Proxy).
  host: "0.0.0.0"

  # TCP-Port, auf dem der FastAPI-Server lauscht.
  port: 8080

  # Anzeigename in der Web-Oberflaeche.
  # Leer oder nicht gesetzt = Hostname des Servers wird verwendet.
  # name: "Mein Produktionsserver"
  name: ""

# ---------------------------------------------------------------------------
# Logging / Audit-Log
# ---------------------------------------------------------------------------
logging:
  # Pfad zur Audit-Log-Datei.
  # Relativ zum Projektstamm oder absoluter Pfad.
  audit_log: "logs/audit.log"

  # Maximale Dateigroesse in Megabyte bevor die Datei rotiert wird.
  max_size_mb: 10

  # Anzahl der Backup-Dateien, die nach der Rotation aufbewahrt werden
  # (z. B. audit.log.1, audit.log.2, ...).
  backup_count: 5

# ---------------------------------------------------------------------------
# UI-Standardwerte
# ---------------------------------------------------------------------------
# Legt fest, welche Spalten und Filter beim Laden der Web-Oberflaeche
# standardmaessig aktiv sind.
#
ui_defaults:
  # Spalte "Starttyp" standardmaessig anzeigen (true/false).
  show_startup_type: false

  # Spalte "Anmelden als" standardmaessig anzeigen (true/false).
  show_logon_as: false

  # Standard-Statusfilter: "all", "running" oder "stopped".
  filter_status: "all"

  # Standard-Starttypfilter: "all", "Automatic", "Manual" oder "Disabled".
  filter_startup_type: "all"

# ---------------------------------------------------------------------------
# Dienst-Filter
# ---------------------------------------------------------------------------
# Legt fest, welche Windows-Dienste in der Web-Oberflaeche angezeigt werden.
#
# Wenn die Liste leer ist (oder dieser Abschnitt fehlt), werden ALLE
# Win32-Dienste angezeigt.
#
# Mehrere Filter werden mit ODER verknuepft: Ein Dienst wird angezeigt,
# wenn er mindestens einen Filter erfuellt.
#
# Filtertypen:
#   prefix   -- Dienstname beginnt mit dem angegebenen Wert (Gross-/Kleinschreibung egal)
#   contains -- Dienstname enthaelt den angegebenen Wert (Gross-/Kleinschreibung egal)
#
service_filters:
  # Zeigt alle Dienste, deren Name mit "MyApp" beginnt.
  # Trifft z. B.: MyAppWorker, MyAppScheduler, myappapi
  - type: "prefix"
    value: "Lim"

  # Zeigt alle Dienste, deren Name "Worker" enthaelt.
  # Trifft z. B.: BackgroundWorker, DataWorker, MyAppWorker
  - type: "contains"
    value: ""

# ---------------------------------------------------------------------------
# Dienst-Ausschlussliste
# ---------------------------------------------------------------------------
# Dienste in dieser Liste werden niemals angezeigt, auch wenn ein Filter
# aus service_filters auf sie zutrifft.
# Verwenden Sie die internen SCM-Dienstnamen (nicht den Anzeigenamen).
#
service_exclude:
  - ""
  - ""

# ---------------------------------------------------------------------------
# Rate Limiting
# ---------------------------------------------------------------------------
# Gilt nur fuer Aktions-Endpunkte (Start, Stop, Restart).
# GET /api/services ist nicht betroffen.
#
rate_limit:
  # Maximale Anzahl von Aktionen pro IP-Adresse innerhalb des Zeitfensters.
  max_requests: 10

  # Laenge des gleitenden Zeitfensters in Sekunden.
  window_seconds: 60

# ---------------------------------------------------------------------------
# Dienst-Steuerung
# ---------------------------------------------------------------------------
# Einstellungen fuer den Zustandswechsel beim Start/Stop eines Dienstes.
#
service_control:
  # Maximale Wartezeit in Sekunden, bis ein Dienst den Zielzustand erreicht.
  # Wird die Zeit ueberschritten, antwortet das Backend mit HTTP 504.
  timeout_seconds: 30

  # Abstand in Millisekunden zwischen zwei Statusabfragen waehrend
  # eines Zustandswechsels (Polling-Intervall).
  poll_interval_ms: 500
